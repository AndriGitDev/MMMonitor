name: Bug report
description: Report reproducible MMMonitor behavior
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: MMMonitor version or commit
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Mac model, chip, and macOS version
      placeholder: Mac mini, M2, macOS 15.6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |-
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed usernames, paths, process names, and other identifying information where possible.
          required: true
