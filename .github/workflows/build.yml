name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-silicon-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build release archive
        run: ./scripts/package-release.sh

      - name: Upload app and checksum
        uses: actions/upload-artifact@v7
        with:
          name: MMMonitor-arm64
          path: |
            dist/MMMonitor-*-arm64.zip
            dist/MMMonitor-*-arm64.zip.sha256
          if-no-files-found: error
